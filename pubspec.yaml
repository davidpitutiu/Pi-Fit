name: pi_fit
description: Pi Fit — workouts, progress and planning in one place.
publish_to: none
version: 0.3.1+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  http: ^1.6.0
  health: 13.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  # PDF currently constrains archive <4.1; newer image releases use missing APIs.
  image: 4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
