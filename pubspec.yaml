name: pi_fit
description: Pi Fit — antrenamente, progres și planificare într-un singur loc.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  http: ^1.6.0
  cached_network_image: ^3.4.1
  health: 13.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
